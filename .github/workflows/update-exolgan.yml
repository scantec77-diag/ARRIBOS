name: Actualizar arribos y posiciones AIS
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-exolgan.yml'
      - 'scripts/update_aisstream.py'
      - 'scripts/update_exolgan.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arribos-exolgan
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar programación Exolgan
        run: python scripts/update_exolgan.py
      - name: Instalar cliente AIS
        run: python -m pip install 'websockets>=12,<16'
      - name: Capturar AIS (máximo 3 minutos, publicar resultados)
        continue-on-error: true
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: timeout --signal=TERM --kill-after=5s 180s python -u scripts/update_aisstream.py
      - name: Publicar datos actualizados
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Guardar los archivos generados antes de sincronizar con main.
          cp data/exolgan.json "$RUNNER_TEMP/exolgan.json"
          cp data/ais.json "$RUNNER_TEMP/ais.json"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/exolgan.json" data/exolgan.json
            cp "$RUNNER_TEMP/ais.json" data/ais.json
            git add data/exolgan.json data/ais.json
            if git diff --cached --quiet; then
              echo "Sin cambios para publicar."
              exit 0
            fi
            git commit -m "Actualizar datos Exolgan y AIS"
            if git push origin HEAD:main; then
              echo "Datos publicados correctamente."
              exit 0
            fi
            echo "La rama cambió durante la publicación; reintentando ($intento/5)."
            sleep 3
          done
          echo "::error::No se pudo publicar después de 5 intentos."
          exit 1
