name: Actualizar arribos Exolgan
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arribos-exolgan
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar Transcargo
        run: python scripts/update_exolgan.py
      - name: Guardar si hubo consulta exitosa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exolgan.json
          git diff --cached --quiet || (git commit -m "Actualizar programación Exolgan" && git push)
