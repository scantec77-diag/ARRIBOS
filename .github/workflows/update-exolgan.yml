name: Actualizar arribos y posiciones AIS
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arribos-exolgan
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar programación Exolgan
        run: python scripts/update_exolgan.py
      - name: Instalar cliente AIS
        run: python -m pip install 'websockets>=12,<16'
      - name: Capturar posiciones AIS durante 2 minutos
        continue-on-error: true
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python scripts/update_aisstream.py
      - name: Publicar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exolgan.json data/ais.json
          git diff --cached --quiet || (git commit -m "Actualizar datos Exolgan y AIS" && git push)
