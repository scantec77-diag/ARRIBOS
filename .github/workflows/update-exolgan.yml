name: Actualizar arribos y posiciones AIS
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-exolgan.yml'
      - 'scripts/update_aisstream.py'
      - 'scripts/update_exolgan.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arribos-exolgan
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar programación Exolgan
        run: python scripts/update_exolgan.py
      - name: Instalar cliente AIS
        run: python -m pip install 'websockets>=12,<16'
      - name: Capturar AIS (máximo 3 minutos, publicar resultados)
        id: ais_capture
        continue-on-error: true
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          mkdir -p debug
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 180s python -u scripts/update_aisstream.py 2>&1 | tee debug/captura-ais.log
          estado=${PIPESTATUS[0]}
          echo "capture_exit_code=$estado" >> "$GITHUB_OUTPUT"
          echo "Código de salida de captura AIS: $estado" | tee -a debug/captura-ais.log
          exit "$estado"
      - name: Publicar datos actualizados
        id: publish_data
        run: |
          exec > >(tee debug/publicacion.log) 2>&1
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Guardar los archivos generados antes de sincronizar con main.
          cp data/exolgan.json "$RUNNER_TEMP/exolgan.json"
          cp data/ais.json "$RUNNER_TEMP/ais.json"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/exolgan.json" data/exolgan.json
            cp "$RUNNER_TEMP/ais.json" data/ais.json
            git add data/exolgan.json data/ais.json
            if git diff --cached --quiet; then
              echo "Sin cambios para publicar."
              exit 0
            fi
            git commit -m "Actualizar datos Exolgan y AIS"
            if git push origin HEAD:main; then
              echo "Datos publicados correctamente."
              exit 0
            fi
            echo "La rama cambió durante la publicación; reintentando ($intento/5)."
            sleep 3
          done
          echo "::error::No se pudo publicar después de 5 intentos."
          exit 1
      - name: Guardar volcado de depuración
        if: always()
        run: |
          mkdir -p debug
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "commit=$GITHUB_SHA"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "job_status=${{ job.status }}"
            echo "capture_outcome=${{ steps.ais_capture.outcome }}"
            echo "publish_outcome=${{ steps.publish_data.outcome }}"
          } > debug/resumen.txt
          for archivo in data/ais.json data/exolgan.json; do
            if [ -f "$archivo" ]; then
              cp "$archivo" "debug/$(basename "$archivo")"
            fi
          done
      - name: Subir archivo de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depuracion-ais-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug/
          retention-days: 14
          if-no-files-found: warn

# Prueba integral AIS -> publicación -> mapa (2026-11-05)
